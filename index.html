<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Grupo CLIGED | Solicitação</title>

<style>

:root{
  --bg:#101010;
  --card:#1b1b1b;
  --gold:#f1e7a8;
  --gold2:#d9ca70;
  --text:#f7f7f7;
  --muted:#b8b8b8;
  --line:#3b3b3b;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  font-family:Arial,sans-serif;
  color:var(--text);
}

.container{
  max-width:500px;
  min-height:100vh;
  margin:auto;
  padding:26px 18px 34px;
}

.logo-wrap{
  text-align:center;
  margin:5px 0 22px;
}

.logo{
  width:190px;
  max-width:72%;
  height:auto;
}

.card{
  background:var(--card);
  border:1px solid #2c2c2c;
  border-radius:20px;
  padding:22px;
  box-shadow:0 12px 35px #0008;
}

h1{
  text-align:center;
  color:var(--gold);
  font-size:24px;
  margin:0 0 8px;
}

.subtitle{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  line-height:1.45;
  margin-bottom:22px;
}

.title{
  display:block;
  color:var(--gold);
  font-weight:bold;
  font-size:15px;
  margin:18px 0 9px;
}

select{
  width:100%;
  padding:14px 12px;
  border-radius:11px;
  border:1px solid var(--line);
  background:#111;
  color:#fff;
  font-size:15px;
}

select:disabled{
  opacity:1;
  color:#fff;
  background:#25231b;
  border-color:var(--gold2);
  cursor:not-allowed;
}

.local-code{
  display:none;
  text-align:center;
  color:var(--gold);
  font-size:13px;
  margin-top:9px;
}

.options{
  display:grid;
  gap:9px;
}

.option{
  display:flex;
  align-items:center;
  gap:11px;
  border:1px solid var(--line);
  border-radius:11px;
  padding:13px;
  background:#151515;
  cursor:pointer;
}

.option.selected{
  border-color:var(--gold2);
  background:#25231b;
}

.option input{
  width:19px;
  height:19px;
  accent-color:#d9ca70;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  margin-top:22px;
  background:var(--gold);
  color:#151515;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.note{
  text-align:center;
  color:#888;
  font-size:12px;
  margin-top:13px;
}

.success{
  display:none;
  text-align:center;
}

.check{
  font-size:58px;
  color:var(--gold);
}

.success h2{
  color:var(--gold);
}

.success p{
  color:var(--muted);
  line-height:1.6;
}

.status-box{
  margin-top:20px;
  padding:16px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#151515;
}

.status-title{
  color:var(--gold);
  font-size:14px;
  font-weight:bold;
  margin-bottom:10px;
}

.status-value{
  font-size:15px;
  line-height:1.5;
  color:#fff;
  word-break:break-word;
}

.status-loading{
  color:#b8b8b8;
}

.status-success{
  color:#9be7a1;
}

.status-warning{
  color:#f1d27a;
}

.status-error{
  color:#ff9a9a;
}

.status-date{
  margin-top:8px;
  color:#888;
  font-size:11px;
}

.reset{
  background:transparent;
  color:var(--gold);
  border:1px solid #5a5332;
}

</style>

</head>

<body>

<div class="container">

  <div class="logo-wrap">

    <img
      class="logo"
      src="logo.png"
      alt="Grupo CLIGED"
      width="190"
      height="190"
      fetchpriority="high"
    >

  </div>


  <!-- =====================================================
       FORMULÁRIO
       ===================================================== -->

  <div class="card" id="form">

    <h1>
      Avise nossa equipe
    </h1>

    <div class="subtitle">
      Informe o que precisa de reposição ou limpeza.
    </div>


    <label class="title">
      📍 Local
    </label>


    <select id="local">

      <option value="">
        Selecione o local...
      </option>

      <option value="B.01">
        B.01 - DIRETORIA
      </option>

      <option value="B.02">
        B.02 - CORREDOR AUTORIZAÇÃO
      </option>

      <option value="B.03">
        B.03 - FINANCEIRO
      </option>

      <option value="B.04">
        B.04 - RH
      </option>

      <option value="B.05">
        B.05 - COMPRAS
      </option>

      <option value="B.06">
        B.06 - ESTOQUE
      </option>

      <option value="B.07">
        B.07 - ESTOQUE
      </option>

      <option value="B.08">
        B.08 - CONTROLADORIA
      </option>

      <option value="B.09">
        B.09 - COWORKING
      </option>

      <option value="B.10">
        B.10 - CORREDOR REUNIÃO
      </option>

      <option value="B.11">
        B.11 - D.P
      </option>

      <option value="B.12">
        B.12 - CORREDOR CALL CENTER
      </option>

      <option value="B.13">
        B.13 - COMFORT ADM
      </option>

      <option value="B.14">
        B.14 - T.I
      </option>

      <option value="B.15">
        B.15 - CTA ADM
      </option>

      <option value="B.16">
        B.16 - MARKETING / INFRAESTRUTURA
      </option>

      <option value="B.17">
        B.17 - FATURAMENTO
      </option>

      <option value="B.18">
        B.18 - AUDITORIA
      </option>

      <option value="B.19">
        B.19 - QUALIDADE
      </option>

    </select>


    <div
      class="local-code"
      id="localCode"
    ></div>


    <label class="title">
      🛠️ O que precisa de atenção?
    </label>


    <div class="options">

      <label class="option">

        <input
          type="checkbox"
          value="Papel higiênico"
        >

        <span>🧻</span>

        <span>
          Papel higiênico
        </span>

      </label>


      <label class="option">

        <input
          type="checkbox"
          value="Papel toalha"
        >

        <span>🧻</span>

        <span>
          Papel toalha
        </span>

      </label>


      <label class="option">

        <input
          type="checkbox"
          value="Sabonete líquido"
        >

        <span>🧴</span>

        <span>
          Sabonete líquido
        </span>

      </label>


      <label class="option">

        <input
          type="checkbox"
          value="Troca/retirada de lixo"
        >

        <span>🗑️</span>

        <span>
          Troca/retirada de lixo
        </span>

      </label>


      <label class="option">

        <input
          type="checkbox"
          value="Solicitar limpeza"
        >

        <span>🧹</span>

        <span>
          Solicitar limpeza
        </span>

      </label>

    </div>


    <button
      id="send"
      disabled
    >
      ENVIAR SOLICITAÇÃO
    </button>


    <div class="note">
      Sua solicitação será registrada para atendimento.
    </div>

  </div>


  <!-- =====================================================
       SUCESSO
       ===================================================== -->

  <div
    class="card success"
    id="success"
  >

    <div class="check">
      ✓
    </div>

    <h2>
      Solicitação enviada!
    </h2>

    <p id="summary"></p>


    <!-- ===================================================
         STATUS
         =================================================== -->

    <div class="status-box">

      <div class="status-title">
        STATUS DA SOLICITAÇÃO
      </div>

      <div
        class="status-value status-loading"
        id="statusValue"
      >
        🔄 Consultando status...
      </div>

      <div
        class="status-date"
        id="statusDate"
      ></div>

    </div>


    <button
      class="reset"
      type="button"
      id="newRequest"
    >
      FAZER NOVA SOLICITAÇÃO
    </button>

  </div>

</div>


<script>

/*
==========================================================
MAPA OFICIAL DOS QR CODES
==========================================================
*/

const LOCAIS = {

  "B.01": "DIRETORIA",
  "B.02": "CORREDOR AUTORIZAÇÃO",
  "B.03": "FINANCEIRO",
  "B.04": "RH",
  "B.05": "COMPRAS",
  "B.06": "ESTOQUE",
  "B.07": "ESTOQUE",
  "B.08": "CONTROLADORIA",
  "B.09": "COWORKING",
  "B.10": "CORREDOR REUNIÃO",
  "B.11": "D.P",
  "B.12": "CORREDOR CALL CENTER",
  "B.13": "COMFORT ADM",
  "B.14": "T.I",
  "B.15": "CTA ADM",
  "B.16": "MARKETING / INFRAESTRUTURA",
  "B.17": "FATURAMENTO",
  "B.18": "AUDITORIA",
  "B.19": "QUALIDADE"

};


/*
==========================================================
URL DA API
==========================================================
*/

const API_URL =
  "https://predio-adm-api.appgrupocliged.workers.dev";


/*
==========================================================
ELEMENTOS
==========================================================
*/

const localEl =
  document.getElementById("local");

const boxes =
  document.querySelectorAll(
    'input[type="checkbox"]'
  );

const btn =
  document.getElementById("send");

const form =
  document.getElementById("form");

const success =
  document.getElementById("success");

const summary =
  document.getElementById("summary");

const newRequest =
  document.getElementById("newRequest");

const localCode =
  document.getElementById("localCode");

const statusValue =
  document.getElementById("statusValue");

const statusDate =
  document.getElementById("statusDate");


/*
==========================================================
VARIÁVEIS DO CHAMADO
==========================================================
*/

let ticketId =
  null;

let statusInterval =
  null;


/*
==========================================================
NOVA SOLICITAÇÃO
==========================================================
*/

newRequest.addEventListener(
  "click",
  () => {

    if(statusInterval){

      clearInterval(
        statusInterval
      );

    }

    location.reload();

  }
);


/*
==========================================================
IDENTIFICAÇÃO DO QR CODE
==========================================================
*/

function identificarLocalPorQRCode(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  const codigo =
    params.get("local");


  if(!codigo){

    return;

  }


  const codigoNormalizado =
    codigo
      .toUpperCase()
      .trim();


  const nomeLocal =
    LOCAIS[
      codigoNormalizado
    ];


  if(!nomeLocal){

    console.error(
      "Código QR inválido:",
      codigoNormalizado
    );

    alert(
      "Código de local inválido."
    );

    return;

  }


  localEl.value =
    codigoNormalizado;


  localEl.disabled =
    true;


  localCode.textContent =
    "📍 Local identificado pelo QR Code: " +
    codigoNormalizado +
    " - " +
    nomeLocal;


  localCode.style.display =
    "block";


  update();

}


/*
==========================================================
ATUALIZAÇÃO DO FORMULÁRIO
==========================================================
*/

function update(){

  const selected =
    [...boxes].filter(
      b => b.checked
    );


  btn.disabled =
    !localEl.value ||
    selected.length === 0;


  boxes.forEach(
    b => {

      b.closest(".option")
        .classList.toggle(
          "selected",
          b.checked
        );

    }
  );

}


/*
==========================================================
EVENTOS
==========================================================
*/

localEl.addEventListener(
  "change",
  update
);


boxes.forEach(
  b => {

    b.addEventListener(
      "change",
      update
    );

  }
);


/*
==========================================================
FORMATA STATUS PARA O SOLICITANTE
==========================================================
*/

function mostrarStatus(
  status
){

  if(!status){

    statusValue.textContent =
      "🔵 Em andamento";

    statusValue.className =
      "status-value";

    return;

  }


  const valor =
    String(
      status
    ).trim();


  const normalizado =
    valor.toUpperCase();


  /*
  ========================================================
  STATUS FINALIZADO
  ========================================================
  */

  if(
    normalizado.includes(
      "FINISHED"
    ) ||
    normalizado.includes(
      "CLOSED"
    ) ||
    normalizado.includes(
      "CONCLU"
    ) ||
    normalizado.includes(
      "FINALIZ"
    ) ||
    normalizado.includes(
      "RESOLV"
    )
  ){

    statusValue.textContent =
      "🟢 Solicitação concluída";

    statusValue.className =
      "status-value status-success";

    return;

  }


  /*
  ========================================================
  STATUS DE ATENDIMENTO / RESPOSTA
  ========================================================
  */

  if(
    normalizado.includes(
      "AWAITING"
    ) ||
    normalizado.includes(
      "CUSTOMER"
    ) ||
    normalizado.includes(
      "RESPONDED"
    ) ||
    normalizado.includes(
      "ANSWERED"
    )
  ){

    statusValue.textContent =
      "🟡 Em atendimento";

    statusValue.className =
      "status-value status-warning";

    return;

  }


  /*
  ========================================================
  OUTROS STATUS
  ========================================================
  */

  statusValue.textContent =
    "🔵 Em andamento";

  statusValue.className =
    "status-value";

}


/*
==========================================================
CONSULTA STATUS
==========================================================
*/

async function consultarStatus(){

  if(!ticketId){

    return;

  }


  try {

    const response =
      await fetch(

        API_URL +
        "/status?id=" +
        encodeURIComponent(
          String(ticketId)
        ),

        {
          method:
            "GET",

          cache:
            "no-store"
        }

      );


    const result =
      await response.json();


    console.log(
      "Status do chamado:",
      result
    );


    if(
      !response.ok ||
      !result.sucesso
    ){

      throw new Error(
        result.mensagem ||
        "Status não disponível."
      );

    }


    /*
    ======================================================
    PEGA O STATUS RETORNADO PELO WORKER
    ======================================================
    */

    const status =
      result.status ||
      result.status_name ||
      result.statusName ||
      result.data?.status ||
      result.data?.status_name ||
      result.data?.statusName;


    mostrarStatus(
      status
    );


    statusDate.textContent =
      "Última atualização: " +
      new Date()
        .toLocaleTimeString(
          "pt-BR"
        );


    /*
    ======================================================
    SE FINALIZADO, PARA A CONSULTA
    ======================================================
    */

    if(
      status &&
      (
        String(status)
          .toUpperCase()
          .includes("FINISHED") ||

        String(status)
          .toUpperCase()
          .includes("CLOSED") ||

        String(status)
          .toUpperCase()
          .includes("CONCLU") ||

        String(status)
          .toUpperCase()
          .includes("FINALIZ") ||

        String(status)
          .toUpperCase()
          .includes("RESOLV")
      )
    ){

      if(statusInterval){

        clearInterval(
          statusInterval
        );

      }

    }

  }
  catch(error){

    console.error(
      "Erro ao consultar status:",
      error
    );


    /*
    ======================================================
    NÃO MOSTRA ERRO TÉCNICO PARA O SOLICITANTE
    ======================================================
    */

    statusValue.textContent =
      "🔵 Em andamento";

    statusValue.className =
      "status-value";

  }

}


/*
==========================================================
INICIA ATUALIZAÇÃO DO STATUS
==========================================================
*/

function iniciarAtualizacaoStatus(){

  /*
  Consulta imediatamente.
  */

  consultarStatus();


  /*
  Consulta a cada 10 segundos.
  */

  statusInterval =
    setInterval(
      consultarStatus,
      10000
    );

}


/*
==========================================================
ENVIO
==========================================================
*/

btn.addEventListener(
  "click",
  async () => {


    const local_code =
      localEl.value;


    const nomeLocal =
      LOCAIS[
        local_code
      ];


    const selected =
      [...boxes]
        .filter(
          b => b.checked
        )
        .map(
          b => b.value
        );


    if(
      !local_code ||
      !LOCAIS[local_code]
    ){

      alert(
        "Local inválido."
      );

      return;

    }


    if(
      selected.length === 0
    ){

      alert(
        "Selecione o que precisa de atenção."
      );

      return;

    }


    btn.disabled =
      true;

    btn.textContent =
      "ENVIANDO...";


    const payload = {

      local_code:
        local_code,

      category_id:
        "52d32a3af1d7fd87c277f7aec520b38b",

      subject:
        "Solicitação - " +
        nomeLocal,

      message:
        "Local: " +
        nomeLocal +
        "\n\nSolicitação:\n- " +
        selected.join("\n- "),

      priority:
        "2"

    };


    console.log(
      "Enviando solicitação:",
      payload
    );


    try {


      const response =
        await fetch(

          API_URL +
          "/solicitacao",

          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify(
                payload
              )

          }

        );


      const result =
        await response.json();


      console.log(
        "Resposta da API:",
        result
      );


      if(
        !response.ok ||
        !result.sucesso
      ){

        throw new Error(
          result.mensagem ||
          "Não foi possível registrar a solicitação."
        );

      }


      /*
      ======================================================
      PEGA O ID DO CHAMADO
      ======================================================
      */

      ticketId =
        result.ticket_id ||
        result.id ||
        result.data?.ticket_id ||
        result.data?.id;


      console.log(
        "Ticket ID:",
        ticketId
      );


      /*
      ======================================================
      RESUMO PARA O SOLICITANTE
      ======================================================
      
      O número do chamado NÃO é mais mostrado.
      
      ======================================================
      */

      summary.innerHTML =

        "<strong>Local:</strong> " +
        local_code +
        " - " +
        nomeLocal +

        "<br><br>" +

        "<strong>Solicitação:</strong><br>" +

        selected.join("<br>") +

        "<br><br>" +

        "<strong>Data:</strong> " +

        new Date()
          .toLocaleString(
            "pt-BR"
          );


      form.style.display =
        "none";


      success.style.display =
        "block";


      /*
      ======================================================
      STATUS INICIAL
      ======================================================
      */

      statusValue.textContent =
        "🔄 Consultando status...";

      statusValue.className =
        "status-value status-loading";


      /*
      ======================================================
      COMEÇA MONITORAMENTO
      ======================================================
      */

      if(ticketId){

        iniciarAtualizacaoStatus();

      }
      else{

        statusValue.textContent =
          "🔵 Em andamento";

        statusValue.className =
          "status-value";

      }


    }
    catch(error){


      console.error(
        "Erro ao enviar solicitação:",
        error
      );


      alert(
        error.message ||
        "Não foi possível enviar a solicitação. Tente novamente."
      );


      btn.disabled =
        false;


      btn.textContent =
        "ENVIAR SOLICITAÇÃO";

    }

  }
);


/*
==========================================================
INICIALIZAÇÃO
==========================================================
*/

identificarLocalPorQRCode();

update();

</script>

</body>

</html>
