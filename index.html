:root{--bg:#101010;--card:#1b1b1b;--gold:#f1e7a8;--gold2:#d9ca70;--text:#f7f7f7;--muted:#b8b8b8;--line:#3b3b3b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text)}
.container{max-width:500px;min-height:100vh;margin:auto;padding:26px 18px 34px}
.logo-wrap{text-align:center;margin:5px 0 22px}.logo{width:190px;max-width:72%;height:auto}
.card{background:var(--card);border:1px solid #2c2c2c;border-radius:20px;padding:22px;box-shadow:0 12px 35px #0008}
h1{text-align:center;color:var(--gold);font-size:24px;margin:0 0 8px}
.subtitle{text-align:center;color:var(--muted);font-size:14px;line-height:1.45;margin-bottom:22px}
.title{display:block;color:var(--gold);font-weight:bold;font-size:15px;margin:18px 0 9px}
select{width:100%;padding:14px 12px;border-radius:11px;border:1px solid var(--line);background:#111;color:#fff;font-size:15px}
.options{display:grid;gap:9px}.option{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:11px;padding:13px;background:#151515;cursor:pointer}
.option.selected{border-color:var(--gold2);background:#25231b}.option input{width:19px;height:19px;accent-color:#d9ca70}
button{width:100%;border:0;border-radius:12px;padding:15px;margin-top:22px;background:var(--gold);color:#151515;font-size:15px;font-weight:800;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}.note{text-align:center;color:#888;font-size:12px;margin-top:13px}
.success{display:none;text-align:center}.check{font-size:58px;color:var(--gold)}.success h2{color:var(--gold)}
.success p{color:var(--muted);line-height:1.6}.reset{background:transparent;color:var(--gold);border:1px solid #5a5332}
</style>

<div class="card" id="form">
<h1>Avise nossa equipe</h1>
<div class="subtitle">Selecione o local e o que precisa de reposição ou limpeza.</div>

<label class="title">📍 Local</label>
<select id="local">
<option value="">Selecione o local...</option>
<option value="Autorização">Autorização</option><option value="Diretoria">Diretoria</option><option value="Gerência">Gerência</option><option value="Call Center">Call Center</option><option value="T.I">T.I</option><option value="CTA">CTA</option><option value="Comfort">Comfort</option><option value="Infraestrutura">Infraestrutura</option><option value="Marketing">Marketing</option><option value="Faturamento">Faturamento</option><option value="Financeiro">Financeiro</option><option value="RH">RH</option><option value="HEAD">HEAD</option><option value="Compras">Compras</option>
</select>

<label class="title">🛠️ O que precisa de atenção?</label>
<div class="options"><label class="option"><input type="checkbox" value="Papel higiênico"><span>🧻</span><span>Papel higiênico</span></label><label class="option"><input type="checkbox" value="Papel toalha"><span>🧻</span><span>Papel toalha</span></label><label class="option"><input type="checkbox" value="Sabonete líquido"><span>🧴</span><span>Sabonete líquido</span></label><label class="option"><input type="checkbox" value="Troca/retirada de lixo"><span>🗑️</span><span>Troca/retirada de lixo</span></label><label class="option"><input type="checkbox" value="Solicitar limpeza"><span>🧹</span><span>Solicitar limpeza</span></label></div>

<button id="send" disabled>ENVIAR SOLICITAÇÃO</button>
<div class="note">Sua solicitação será registrada para atendimento.</div>
</div>

<div class="card success" id="success">
<div class="check">✓</div>
<h2>Solicitação enviada!</h2>
<p id="summary"></p>
<button class="reset" onclick="location.reload()">FAZER NOVA SOLICITAÇÃO</button>
</div>
</div>

<script>
const localEl=document.getElementById('local');
const boxes=document.querySelectorAll('input[type=checkbox]');
const btn=document.getElementById('send');

function update(){
 const selected=[...boxes].filter(b=>b.checked);
 btn.disabled=!localEl.value || selected.length===0;
 boxes.forEach(b=>b.closest('.option').classList.toggle('selected',b.checked));
}
localEl.addEventListener('change',update);
boxes.forEach(b=>b.addEventListener('change',update));

btn.addEventListener('click', async ()=>{
  const local=localEl.value;
  const selected=[...boxes].filter(b=>b.checked).map(b=>b.value);

  btn.disabled=true;
  btn.textContent='ENVIANDO...';

  const payload={
    customer_id:'moreiradasilvafabio31@gmail.com',
    customer_id_type:'E',
    department_id:'2d507dafee35b29d9e5852d9b0c4ce2c',
    category_id:'52d32a3af1d7fd87c277f7aec520b38b',
    subject:'Solicitação - '+local,
    message:'Local: '+local+'\\n\\nSolicitação:\\n- '+selected.join('\\n- '),
    priority:'2'
  };

  try {
    const response=await fetch('https://predio-adm-api.onrender.com/solicitacao',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });

    const result=await response.json();

    if(!response.ok || !result.sucesso){
      throw new Error(result.mensagem || 'Não foi possível registrar a solicitação.');
    }

    document.getElementById('summary').innerHTML =
      '<strong>Local:</strong> '+local+'<br><br>'+
      '<strong>Solicitação:</strong><br>'+selected.join('<br>')+
      '<br><br><strong>Data:</strong> '+new Date().toLocaleString('pt-BR');

    document.getElementById('form').style.display='none';
    document.getElementById('success').style.display='block';

  } catch(error) {
    console.error(error);
    alert('Não foi possível enviar a solicitação. Tente novamente.');
    btn.disabled=false;
    btn.textContent='ENVIAR SOLICITAÇÃO';
  }
});
</script>
