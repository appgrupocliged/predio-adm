<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Grupo CLIGED | Solicitação</title>


<style>

:root{
  --bg:#101010;
  --card:#1b1b1b;
  --gold:#f1e7a8;
  --gold2:#d9ca70;
  --text:#f7f7f7;
  --muted:#b8b8b8;
  --line:#3b3b3b
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--bg);
  font-family:Arial,sans-serif;
  color:var(--text)
}

.container{
  max-width:500px;
  min-height:100vh;
  margin:auto;
  padding:26px 18px 34px
}

.logo-wrap{
  text-align:center;
  margin:5px 0 22px
}

.logo{
  width:190px;
  max-width:72%;
  height:auto
}

.card{
  background:var(--card);
  border:1px solid #2c2c2c;
  border-radius:20px;
  padding:22px;
  box-shadow:0 12px 35px #0008
}

h1{
  text-align:center;
  color:var(--gold);
  font-size:24px;
  margin:0 0 8px
}

.subtitle{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  line-height:1.45;
  margin-bottom:22px
}

.title{
  display:block;
  color:var(--gold);
  font-weight:bold;
  font-size:15px;
  margin:18px 0 9px
}

select{
  width:100%;
  padding:14px 12px;
  border-radius:11px;
  border:1px solid var(--line);
  background:#111;
  color:#fff;
  font-size:15px
}

select:disabled{
  opacity:1;
  color:#fff;
  background:#171717;
  border-color:var(--gold2);
  cursor:not-allowed
}

.options{
  display:grid;
  gap:9px
}

.option{
  display:flex;
  align-items:center;
  gap:11px;
  border:1px solid var(--line);
  border-radius:11px;
  padding:13px;
  background:#151515;
  cursor:pointer
}

.option.selected{
  border-color:var(--gold2);
  background:#25231b
}

.option input{
  width:19px;
  height:19px;
  accent-color:#d9ca70
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  margin-top:22px;
  background:var(--gold);
  color:#151515;
  font-size:15px;
  font-weight:800;
  cursor:pointer
}

button:disabled{
  opacity:.45;
  cursor:not-allowed
}

.note{
  text-align:center;
  color:#888;
  font-size:12px;
  margin-top:13px
}

.success{
  display:none;
  text-align:center
}

.check{
  font-size:58px;
  color:var(--gold)
}

.success h2{
  color:var(--gold)
}

.success p{
  color:var(--muted);
  line-height:1.6
}

.reset{
  background:transparent;
  color:var(--gold);
  border:1px solid #5a5332
}

</style>

</head>


<body>


<div class="container">


  <div class="logo-wrap">

    <img
      class="logo"
      src="logo.png"
      alt="Grupo CLIGED"
      width="190"
      height="190"
      fetchpriority="high"
    >

  </div>


  <div class="card" id="form">

    <h1>
      Avise nossa equipe
    </h1>


    <div class="subtitle">
      Selecione o local e o que precisa de reposição ou limpeza.
    </div>


    <label class="title">
      📍 Local
    </label>


    <select id="local">

      <option value="">
        Selecione o local...
      </option>

      <option value="DIRETORIA">
        Diretoria
      </option>

      <option value="CORREDOR AUTORIZAÇÃO">
        Corredor Autorização
      </option>

      <option value="FINANCEIRO">
        Financeiro
      </option>

      <option value="RH">
        RH
      </option>

      <option value="COMPRAS">
        Compras
      </option>

      <option value="ESTOQUE">
        Estoque
      </option>

      <option value="CONTROLADORIA">
        Controladoria
      </option>

      <option value="COWORKING">
        Coworking
      </option>

      <option value="CORREDOR REUNIÃO">
        Corredor Reunião
      </option>

      <option value="D.P">
        D.P
      </option>

      <option value="CORREDOR CALL CENTER">
        Corredor Call Center
      </option>

      <option value="COMFORT ADM">
        Comfort ADM
      </option>

      <option value="T.I">
        T.I
      </option>

      <option value="CTA ADM">
        CTA ADM
      </option>

      <option value="MARKETING / INFRAESTRUTURA">
        Marketing / Infraestrutura
      </option>

      <option value="FATURAMENTO">
        Faturamento
      </option>

      <option value="AUDITORIA">
        Auditoria
      </option>

      <option value="QUALIDADE">
        Qualidade
      </option>

    </select>


    <label class="title">
      🛠️ O que precisa de atenção?
    </label>


    <div class="options">


      <label class="option">

        <input
          type="checkbox"
          value="Papel higiênico"
        >

        <span>🧻</span>

        <span>
          Papel higiênico
        </span>

      </label>


      <label class="option">

        <input
          type="checkbox"
          value="Papel toalha"
        >

        <span>🧻</span>

        <span>
          Papel toalha
        </span>

      </label>


      <label class="option">

        <input
          type="checkbox"
          value="Sabonete líquido"
        >

        <span>🧴</span>

        <span>
          Sabonete líquido
        </span>

      </label>


      <label class="option">

        <input
          type="checkbox"
          value="Troca/retirada de lixo"
        >

        <span>🗑️</span>

        <span>
          Troca/retirada de lixo
        </span>

      </label>


      <label class="option">

        <input
          type="checkbox"
          value="Solicitar limpeza"
        >

        <span>🧹</span>

        <span>
          Solicitar limpeza
        </span>

      </label>


    </div>


    <button id="send" disabled>
      ENVIAR SOLICITAÇÃO
    </button>


    <div class="note">
      Sua solicitação será registrada para atendimento.
    </div>

  </div>


  <div class="card success" id="success">

    <div class="check">
      ✓
    </div>

    <h2>
      Solicitação enviada!
    </h2>

    <p id="summary"></p>

    <button
      class="reset"
      type="button"
      id="newRequest"
    >
      FAZER NOVA SOLICITAÇÃO
    </button>

  </div>


</div>


<script>


// ============================================================
// MAPA DOS QR CODES
// ============================================================
//
// O código do QR NÃO é enviado como nome do local.
//
// Exemplo:
//
// B.17
// ↓
// local_code = "B.17"
// ↓
// Worker
// ↓
// FATURAMENTO
//
// O mesmo processo vale para todos os códigos.
//
// ============================================================


const locaisQR = {

  "B.1": "DIRETORIA",

  "B.2": "CORREDOR AUTORIZAÇÃO",

  "B.3": "FINANCEIRO",

  "B.4": "RH",

  "B.5": "COMPRAS",

  "B.6": "ESTOQUE",

  "B.7": "ESTOQUE",

  "B.8": "CONTROLADORIA",

  "B.9": "COWORKING",

  "B.10": "CORREDOR REUNIÃO",

  "B.11": "D.P",

  "B.12": "CORREDOR CALL CENTER",

  "B.13": "COMFORT ADM",

  "B.14": "T.I",

  "B.15": "CTA ADM",

  "B.16": "MARKETING / INFRAESTRUTURA",

  "B.17": "FATURAMENTO",

  "B.18": "AUDITORIA",

  "B.19": "QUALIDADE"

};


// ============================================================
// ELEMENTOS
// ============================================================


const localEl =
  document.getElementById("local");


const boxes =
  document.querySelectorAll(
    'input[type="checkbox"]'
  );


const btn =
  document.getElementById("send");


const form =
  document.getElementById("form");


const success =
  document.getElementById("success");


const summary =
  document.getElementById("summary");


const newRequest =
  document.getElementById("newRequest");


// ============================================================
// NOVA SOLICITAÇÃO
// ============================================================


newRequest.addEventListener(
  "click",
  () => location.reload()
);


// ============================================================
// ATUALIZA FORMULÁRIO
// ============================================================


function update(){

  const selected =
    [...boxes].filter(
      b => b.checked
    );


  btn.disabled =
    !localEl.value ||
    selected.length === 0;


  boxes.forEach(b => {

    b.closest(".option")
      .classList.toggle(
        "selected",
        b.checked
      );

  });

}


// ============================================================
// EVENTOS
// ============================================================


localEl.addEventListener(
  "change",
  update
);


boxes.forEach(
  b =>
    b.addEventListener(
      "change",
      update
    )
);


// ============================================================
// IDENTIFICA QR CODE
// ============================================================


const params =
  new URLSearchParams(
    window.location.search
  );


const codigoLocalURL =
  params.get("local");


// Normaliza o código.
//
// B.17
// b.17
// B.17 com espaços
//
// passam a ser tratados como B.17.


const codigoQR =
  codigoLocalURL
    ? codigoLocalURL
        .trim()
        .toUpperCase()
    : null;


// ============================================================
// APLICA LOCAL DO QR
// ============================================================


if (
  codigoQR &&
  locaisQR[codigoQR]
) {

  // Mostra o NOME no formulário
  localEl.value =
    locaisQR[codigoQR];


  // Impede alteração manual
  localEl.disabled =
    true;


  update();

}


// ============================================================
// ENVIO
// ============================================================


btn.addEventListener(
  "click",
  async () => {


    const local =
      localEl.value;


    const selected =
      [...boxes]
        .filter(
          b => b.checked
        )
        .map(
          b => b.value
        );


    // ========================================================
    // VALIDAÇÕES
    // ========================================================


    if (
      codigoQR &&
      !locaisQR[codigoQR]
    ) {

      alert(
        "Código de local inválido."
      );

      return;

    }


    if (!local) {

      alert(
        "Selecione um local."
      );

      return;

    }


    if (
      selected.length === 0
    ) {

      alert(
        "Selecione pelo menos uma opção."
      );

      return;

    }


    // ========================================================
    // BOTÃO
    // ========================================================


    btn.disabled =
      true;


    btn.textContent =
      "ENVIANDO...";


    // ========================================================
    // PAYLOAD
    // ========================================================
    //
    // ESTA É A PARTE IMPORTANTE.
    //
    // O Worker precisa receber:
    //
    // local_code
    // department_id
    // category_id
    // subject
    // message
    // priority
    //
    // ========================================================


    const payload = {

      // Código do QR
      local_code:
        codigoQR || null,


      // Cliente correto
      customer_id:
        "appgrupocliged@gmail.com",


      customer_id_type:
        "E",


      // Departamento Infraestrutura
      department_id:
        "2d507dafee35b29d9e5852d9b0c4ce2c",


      // Categoria Prédio ADM
      category_id:
        "52d32a3af1d7fd87c277f7aec520b38b",


      // Assunto
      subject:
        "Solicitação - " +
        local,


      // Mensagem
      message:
        "Local: " +
        local +
        "\n\nSolicitação:\n- " +
        selected.join(
          "\n- "
        ),


      // Prioridade
      priority:
        "2"

    };


    // ========================================================
    // LOG PARA TESTE
    // ========================================================


    console.log(
      "Enviando solicitação:",
      payload
    );


    // ========================================================
    // ENVIO PARA WORKER
    // ========================================================


    try {


      const response =
        await fetch(
          "https://predio-adm-api.appgrupocliged.workers.dev/solicitacao",
          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify(
                payload
              )

          }
        );


      // ======================================================
      // RESPOSTA DA API
      // ======================================================


      const result =
        await response.json();


      console.log(
        "Resposta da API:",
        result
      );


      // ======================================================
      // ERRO
      // ======================================================


      if (
        !response.ok ||
        !result.sucesso
      ) {

        throw new Error(
          result.mensagem ||
          "Não foi possível registrar a solicitação."
        );

      }


      // ======================================================
      // SUCESSO
      // ======================================================


      summary.innerHTML =

        "<strong>Local:</strong> " +
        local +

        "<br><br>" +

        "<strong>Solicitação:</strong><br>" +

        selected.join(
          "<br>"
        ) +

        "<br><br>" +

        "<strong>Data:</strong> " +

        new Date()
          .toLocaleString(
            "pt-BR"
          );


      form.style.display =
        "none";


      success.style.display =
        "block";


    }


    catch(error) {


      console.error(
        "Erro ao enviar solicitação:",
        error
      );


      alert(
        error.message ||
        "Não foi possível enviar a solicitação. Tente novamente."
      );


      btn.disabled =
        false;


      btn.textContent =
        "ENVIAR SOLICITAÇÃO";

    }

  }
);


</script>


</body>

</html>
