<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Grupo CLIGED | Solicitação</title>

<style>
:root{
  --bg:#101010;

*{

}

body{
  margin:0;
  background:var(--bg);
  font-family:Arial,sans-serif;
  color:var(--text)
}

.container{
  max-width:500px;
  min-height:100vh;

  padding:26px 18px 34px
}

.logo-wrap{
  text-align:center;
  margin:5px 0 22px
}

.logo{
  width:190px;
  max-width:72%;
  height:auto
}

.card{
  background:var(--card);
  border:1px solid #2c2c2c;
  border-radius:20px;
  padding:22px;
  box-shadow:0 12px 35px #0008
}

h1{
  text-align:center;
  color:var(--gold);
  font-size:24px;
  margin:0 0 8px
}

.subtitle{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  line-height:1.45;
  margin-bottom:22px
}

.title{
  display:block;
  color:var(--gold);
  font-weight:bold;
  font-size:15px;
  margin:18px 0 9px
}

select{
  width:100%;
  padding:14px 12px;
  border-radius:11px;
  border:1px solid var(--line);
  background:#111;
  color:#fff;
  font-size:15px
}

select:disabled{
  opacity:1;
  color:#fff;
  background:#171717;
  border-color:var(--gold2);
  cursor:not-allowed
}

.options{
  display:grid;
  gap:9px
}

.option{
  display:flex;
  align-items:center;
  gap:11px;
  border:1px solid var(--line);
  border-radius:11px;

.option.selected{
  border-color:var(--gold2);

.option input{
  width:19px;

  accent-color:#d9ca70

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  margin-top:22px;
  background:var(--gold);
  color:#151515;
  font-size:15px;
  font-weight:800;
  cursor:pointer
}

button:disabled{
  opacity:.45;

}

.note{

.success{

}

.success h2{
  color:var(--gold)
}

.success p{
  color:var(--muted);
  line-height:1.6
}

.reset{
  background:transparent;
  color:var(--gold);
  border:1px solid #5a5332
}
</style>
</head>

<body>

    <img

  </div>

  <div class="card" id="form">

    <h1>Avise nossa equipe</h1>

    <div class="subtitle">

    <label class="title">📍 Local</label>

    <select id="local">

      <option value="">Selecione o local...</option>

      <option value="DIRETORIA">Diretoria</option>

      <option value="CORREDOR AUTORIZAÇÃO">
        Corredor Autorização
      </option>

      <option value="FINANCEIRO">

      </option>

      <option value="RH">
        RH
      </option>

      <option value="COMPRAS">
        Compras
      </option>

      <option value="ESTOQUE">
        Estoque
      </option>

      <option value="CONTROLADORIA">
        Controladoria
      </option>

      <option value="COWORKING">
        Coworking
      </option>

      <option value="CORREDOR REUNIÃO">
        Corredor Reunião
      </option>

      <option value="D.P">
        D.P
      </option>

      <option value="CORREDOR CALL CENTER">
        Corredor Call Center
      </option>

      <option value="COMFORT ADM">
        Comfort ADM
      </option>

      <option value="T.I">
        T.I
      </option>

      <option value="CTA ADM">
        CTA ADM
      </option>

      <option value="MARKETING / INFRAESTRUTURA">
        Marketing / Infraestrutura
      </option>

      <option value="FATURAMENTO">
        Faturamento
      </option>

      <option value="AUDITORIA">
        Auditoria
      </option>

      <option value="QUALIDADE">
        Qualidade
      </option>

    </select>


    <label class="title">
      🛠️ O que precisa de atenção?
    </label>


    <div class="options">

      <label class="option">
        <input
          type="checkbox"
          value="Papel higiênico"
        >
        <span>🧻</span>
        <span>Papel higiênico</span>
      </label>


      <label class="option">
        <input
          type="checkbox"
          value="Papel toalha"
        >
        <span>🧻</span>
        <span>Papel toalha</span>
      </label>


      <label class="option">
        <input
          type="checkbox"
          value="Sabonete líquido"
        >
        <span>🧴</span>
        <span>Sabonete líquido</span>
      </label>


      <label class="option">
        <input
          type="checkbox"
          value="Troca/retirada de lixo"
        >
        <span>🗑️</span>

      </label>


      <label class="option">

        >
        <span>🧹</span>

    <button id="send" disabled>

    <p id="summary"></p>

    <button
      class="reset"

      id="newRequest"
    >
      FAZER NOVA SOLICITAÇÃO
    </button>

  </div>

</div>


<script>

/*
====================================================
MAPEAMENTO DOS QR CODES
====================================================

B.1  = DIRETORIA
B.2  = CORREDOR AUTORIZAÇÃO
B.3  = FINANCEIRO
B.4  = RH
B.5  = COMPRAS
B.6  = ESTOQUE
B.7  = ESTOQUE
B.8  = CONTROLADORIA
B.9  = COWORKING
B.10 = CORREDOR REUNIÃO
B.11 = D.P
B.12 = CORREDOR CALL CENTER
B.13 = COMFORT ADM
B.14 = T.I
B.15 = CTA ADM
B.16 = MARKETING / INFRAESTRUTURA
B.17 = FATURAMENTO
B.18 = AUDITORIA
B.19 = QUALIDADE

====================================================
*/

const locaisQR = {

  "B.1": "DIRETORIA",

  "B.2": "CORREDOR AUTORIZAÇÃO",

  "B.3": "FINANCEIRO",

  "B.4": "RH",

  "B.5": "COMPRAS",

  "B.6": "ESTOQUE",

  "B.7": "ESTOQUE",

  "B.8": "CONTROLADORIA",

  "B.9": "COWORKING",

  "B.10": "CORREDOR REUNIÃO",

  "B.11": "D.P",

  "B.12": "CORREDOR CALL CENTER",

  "B.13": "COMFORT ADM",

  "B.14": "T.I",

  "B.15": "CTA ADM",

  "B.16": "MARKETING / INFRAESTRUTURA",

  "B.17": "FATURAMENTO",

  "B.18": "AUDITORIA",

  "B.19": "QUALIDADE"

};


const localEl =
  document.getElementById("local");

const boxes =
  document.querySelectorAll(
    'input[type="checkbox"]'
  );

const btn =
  document.getElementById("send");

const form =
  document.getElementById("form");

const success =
  document.getElementById("success");

const summary =
  document.getElementById("summary");

const newRequest =
  document.getElementById("newRequest");


/*
====================================================
NOVA SOLICITAÇÃO
====================================================
*/

newRequest.addEventListener(
  "click",
  () => location.reload()
);


/*
====================================================
ATUALIZAÇÃO DO FORMULÁRIO
====================================================
*/

function update(){

  const selected =
    [...boxes].filter(
      b => b.checked
    );

  btn.disabled =
    !localEl.value ||
    selected.length === 0;


  boxes.forEach(b => {

    b.closest(".option")
      .classList.toggle(
        "selected",
        b.checked
      );

  });

}


/*
====================================================
EVENTOS
====================================================
*/

localEl.addEventListener(
  "change",
  update
);


boxes.forEach(
  b =>
    b.addEventListener(
      "change",
      update
    )
);


/*
====================================================
IDENTIFICAÇÃO DO QR CODE
====================================================

Quando alguém acessar:

https://appgrupocliged.github.io/predio-adm/?local=B.14

o sistema identifica B.14 e transforma
automaticamente em T.I.

====================================================
*/

const params =
  new URLSearchParams(
    window.location.search
  );

const codigoLocal =
  params.get("local");


if (
  codigoLocal &&
  locaisQR[codigoLocal]
) {

  localEl.value =
    locaisQR[codigoLocal];

  /*
  Impede que o usuário altere o local
  quando o acesso veio de um QR Code.
  */

  localEl.disabled = true;

  update();

}


/*
====================================================
ENVIO DA SOLICITAÇÃO
====================================================
*/

btn.addEventListener(
  "click",
  async () => {

    const local =
      localEl.value;


    const selected =
      [...boxes]
        .filter(
          b => b.checked
        )
        .map(
          b => b.value
        );


    btn.disabled = true;

    btn.textContent =
      "ENVIANDO...";


    /*
    ================================================
    PAYLOAD ENVIADO PARA O WORKER
    ================================================
    */

    const payload = {

      customer_id:
        "moreiradasilvafabio31@gmail.com",

      customer_id_type:
        "E",

      department_id:
        "2d507dafee35b29d9e5852d9b0c4ce2c",

      category_id:
        "52d32a3af1d7fd87c277f7aec520b38b",

      subject:
        "Solicitação - " + local,

      message:
        "Local: " +
        local +
        "\n\nSolicitação:\n- " +
        selected.join("\n- "),

      priority:
        "2"

    };


    try {

      /*
      ==============================================
      WORKER / API
      ==============================================
      */

      const response =
        await fetch(
          "https://predio-adm-api.appgrupocliged.workers.dev/solicitacao",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(
                payload
              )
          }
        );


      const result =
        await response.json();


      /*
      ==============================================
      VERIFICAÇÃO DO RETORNO
      ==============================================
      */

      if (
        !response.ok ||
        !result.sucesso
      ) {

        throw new Error(
          result.mensagem ||
          "Não foi possível registrar a solicitação."
        );

      }


      /*
      ==============================================
      TELA DE SUCESSO
      ==============================================
      */

      summary.innerHTML =

        "<strong>Local:</strong> " +
        local +

        "<br><br>" +

        "<strong>Solicitação:</strong><br>" +

        selected.join("<br>") +

        "<br><br>" +

        "<strong>Data:</strong> " +

        new Date()
          .toLocaleString("pt-BR");


      form.style.display =
        "none";

      success.style.display =
        "block";

    }


    catch(error) {

      console.error(error);


      alert(
        "Não foi possível enviar a solicitação. Tente novamente."
      );


      btn.disabled =
        false;


      btn.textContent =
        "ENVIAR SOLICITAÇÃO";

    }

  }
);

</script>

</body>
</html>
